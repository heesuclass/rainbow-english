<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd9ea">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="레인보우 영어">
<title>📺 Team Battle Board - TV 팀 대항전</title>
<link rel="stylesheet" href="common.css">
<style>
.wrap{max-width:1600px}
.main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}
@media (max-width:900px){.main{grid-template-columns:1fr}.tiles{height:auto}.tile{aspect-ratio:1.4}}
.teams{display:flex;flex-direction:column;gap:10px}
.team{border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);transition:.2s;box-shadow:0 5px 0 #eadffc}
.team.now{border-color:var(--yellow);background:#fff6d1;transform:scale(1.03)}
.team .nm{flex:1;font-weight:900;font-size:20px;line-height:1.1}.team .nm small{display:block;font-size:13px;color:#e08a00}
.team .pt{font-size:40px;font-weight:900;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.team button{width:36px;height:36px;border-radius:10px;border:0;font-size:20px;font-weight:900;cursor:pointer;background:#f3efff;color:var(--ink)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));grid-auto-rows:1fr;height:calc(100dvh - 120px);min-height:420px}
.tile{border:0;min-height:0;border-radius:20px;font:inherit;font-size:clamp(30px,4vw,56px);font-weight:900;color:#fff;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.12);transition:transform .1s;font-family:'NanumSquareRound','Fredoka','Nanum Gothic',sans-serif;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.tile:active{transform:translateY(5px)}
.tile.used{opacity:.22;pointer-events:none;box-shadow:none;filter:grayscale(.6)}
.tile:nth-child(6n+1){background:#ff8fab}.tile:nth-child(6n+2){background:#6cb2ff}.tile:nth-child(6n+3){background:#ffc94d}.tile:nth-child(6n+4){background:#4fd9a3}.tile:nth-child(6n+5){background:#a58bff}.tile:nth-child(6n){background:#ffa463}
.modal{position:fixed;inset:0;background:rgba(80,60,140,.4);display:grid;place-items:center;z-index:500;padding:20px;backdrop-filter:blur(5px)}
.qcard{background:#fff;color:var(--ink);border-radius:32px;width:min(1100px,96vw);padding:28px 32px;border:4px solid var(--line);box-shadow:0 14px 0 #e2d6fb;text-align:center}
.qtype{display:inline-block;background:#f3efff;color:#4a22c9;font-weight:900;font-size:22px;border-radius:999px;padding:8px 20px}
.qmain{font-size:clamp(34px,5.5vw,76px);font-weight:900;margin:22px 0 10px;line-height:1.15}
.qsub{font-size:clamp(20px,2.6vw,30px);color:var(--muted);font-weight:700}
.ans{font-size:clamp(28px,4.4vw,60px);font-weight:900;color:#ff5da2;margin-top:14px;min-height:1.2em}
.ptsbadge{font-size:24px;font-weight:900;color:#d9a700}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;background:conic-gradient(var(--pink) var(--p,100%),#eee 0);margin:0 auto}
.ring span{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center}
.evt{font-size:150px;line-height:1}
.tpick{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.setup-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stepper{display:flex;align-items:center;gap:14px}.stepper b{font-size:40px;min-width:60px;text-align:center}
.sc{letter-spacing:10px}
</style></head><body>
<div class="wrap" id="app"></div>
<script src="common.js"></script>
<script>
const {$,sfx,speak,shuffle,sample,pick,toast,confetti,getTheme,themePicker,lastTheme,esc}=RB;
const TCOL=['#ff8fab','#6cb2ff','#ffc94d','#4fd9a3','#a58bff','#ffa463'];
const TEMO=['🦄','🐯','🐬','🦖','🐼','🦅'];
const EVENTS=[{e:'🎁',n:'GIFT!',d:'선물 +2점',k:'gift'},{e:'🦊',n:'STEAL!',d:'다른 팀 2점 가져오기',k:'steal'},{e:'🔄',n:'SWAP!',d:'다른 팀과 점수 바꾸기',k:'swap'},
  {e:'💣',n:'BOMB!',d:'앗! -2점',k:'bomb'},{e:'⚡',n:'THUNDER!',d:'다른 모든 팀 -1점',k:'thunder'},{e:'🍀',n:'LUCKY!',d:'모든 팀 +1점',k:'lucky'}];
const app=$('#app');
let G={n:5,names:[],theme:lastTheme(),tiles:20,ev:5};
function shell(html){app.innerHTML='';app.appendChild(RB.topbar('📺 Team Battle Board','TV 팀 대항전'));const d=document.createElement('div');d.innerHTML=html;app.appendChild(d);return d}
function setup(){
  if(G.names.length<6)G.names=[1,2,3,4,5,6].map(i=>i+'모둠');
  shell(`<div class="center" style="gap:8px;margin:0 0 16px"><h1 class="hero">📺 Team Battle Board</h1><p class="sub">TV에 띄우고 모둠 대항전! 번호를 고르면 영어 미션 또는 깜짝 이벤트가 나와요.</p></div>
   <div class="card grid">
    <div class="row" style="justify-content:space-between"><b style="font-size:20px">👥 모둠 수</b><div class="stepper"><button class="btn sm white" id="m">−</button><b id="nv">${G.n}</b><button class="btn sm white" id="p">＋</button></div></div>
    <div class="setup-teams" id="st"></div>
    <div class="row" style="justify-content:space-between"><b style="font-size:20px">🔢 칸 수</b><div class="row">${[15,20,25,30].map(n=>`<button class="btn sm ${G.tiles===n?'pink':'white'}" data-t="${n}">${n}칸</button>`).join('')}</div></div>
    <b style="font-size:20px">📚 단어 주제</b><div id="tp"></div>
    <button class="btn big pink" id="go">🎮 대항전 시작</button></div>`);
  function drawT(){$('#st').innerHTML=Array.from({length:G.n},(_,i)=>`<input class="txt" data-i="${i}" value="${esc(G.names[i])}" style="border-color:${TCOL[i]}">`).join('');
    document.querySelectorAll('#st input').forEach(x=>x.oninput=()=>G.names[+x.dataset.i]=x.value)}
  drawT();
  $('#m').onclick=()=>{G.n=Math.max(2,G.n-1);$('#nv').textContent=G.n;drawT()};$('#p').onclick=()=>{G.n=Math.min(6,G.n+1);$('#nv').textContent=G.n;drawT()};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{G.tiles=+b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>{x.classList.toggle('pink',x===b);x.classList.toggle('white',x!==b)})});
  themePicker($('#tp'),id=>G.theme=id,G.theme);
  $('#go').onclick=start;
}
function start(){
  G.t=getTheme(G.theme);G.sc=Array(G.n).fill(0);G.turn=0;G.used=new Set();
  const evN=Math.round(G.tiles/4);const evPos=new Set(sample([...Array(G.tiles).keys()],evN));
  G.map=Array.from({length:G.tiles},(_,i)=>evPos.has(i)?{ev:pick(EVENTS)}:{q:true,pts:pick([1,1,2,2,3])});
  draw();
}
function draw(){
  const cols=G.tiles<=15?5:G.tiles<=20?5:6;
  shell(`<div class="main"><div class="teams">${G.sc.map((s,i)=>`<div class="team ${i===G.turn?'now':''}" style="${i===G.turn?'':'border-left:8px solid '+TCOL[i]}">
     <span style="font-size:34px">${TEMO[i]}</span><div class="nm">${esc(G.names[i])}<small>${i===G.turn?'👉 지금 차례':''}</small></div>
     <div style="display:flex;flex-direction:column;gap:4px"><button data-a="+" data-i="${i}">+</button><button data-a="-" data-i="${i}">−</button></div><div class="pt">${s}</div></div>`).join('')}
     <button class="btn sm white" id="skip">⏭️ 차례 넘기기</button><button class="btn sm white" id="end">🏁 게임 끝내기</button></div>
    <div class="tiles" style="--cols:${cols}">${G.map.map((_,i)=>`<button class="tile en ${G.used.has(i)?'used':''}" data-i="${i}">${i+1}</button>`).join('')}</div></div>`);
  document.querySelectorAll('.team button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;G.sc[i]+=b.dataset.a==='+'?1:-1;G.sc[i]=Math.max(0,G.sc[i]);sfx('click');draw()});
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>open(+b.dataset.i));
  $('#skip').onclick=()=>{nextTurn()};$('#end').onclick=finish;
}
function nextTurn(){G.turn=(G.turn+1)%G.n;draw();if(G.used.size>=G.tiles)setTimeout(finish,400)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="qcard pop">${html}</div>`;document.body.appendChild(m);return m}
function open(i){G.used.add(i);sfx('flip');const c=G.map[i];c.ev?event(c.ev):question(c.pts)}
function makeQ(){
  const T=G.t,w=pick(T.words),s=pick(T.sents);
  const qs=T.sents.filter(x=>/\?$/.test(x.en));
  const types=['pic','pic','sentKo','listen','scramble','blank'];if(qs.length)types.push('answer');
  if(T.qa&&T.qa.length)types.push('qa','qa');
  const ty=pick(types);
  if(ty==='qa'){const [qq,aa]=pick(T.qa);return{l:'💬 Complete the talk!',m:`<span style="font-size:.55em;display:inline-block;text-align:left;line-height:1.4">${esc(qq).replace(/\n/g,'<br>')}</span>`,s:'빈칸이나 대답을 영어로 말해요',a:aa}}
  if(ty==='pic')return{l:'🖼️ Say it in English!',m:`<div style="font-size:1.8em">${w.e}</div>`,s:esc(w.ko),a:w.en};
  if(ty==='sentKo')return{l:'🗣️ Say it in English!',m:`<span style="font-size:.8em">🇰🇷 ${esc(s.ko)}</span>`,s:'우리말을 영어 문장으로 말해요',a:s.en};
  if(ty==='listen')return{l:'🎧 Listen & Repeat!',m:'🔊',s:'잘 듣고 모둠이 다 같이 따라 말해요',a:s.en,say:s.en};
  if(ty==='scramble'){const one=T.words.filter(x=>!x.en.includes(' '));const ww=one.length?pick(one):w;let sc;do{sc=shuffle(ww.en.split('')).join('')}while(sc===ww.en&&ww.en.length>2);
    return{l:'🔤 Unscramble!',m:`<span class="en sc">${esc(sc.toUpperCase())}</span>`,s:`힌트: ${ww.e} ${esc(ww.ko)}`,a:ww.en}}
  if(ty==='blank'){const tk=s.en.split(' ');const c=tk.map((x,i)=>i).filter(i=>i>0&&tk[i].replace(/[^A-Za-z]/g,'').length>=3);if(c.length){const bi=pick(c);const word=tk[bi].replace(/[^A-Za-z']/g,'');
    return{l:'🕳️ Fill in the blank!',m:`<span style="font-size:.75em">${tk.map((x,i)=>i===bi?x.replace(word,'_____'):esc(x)).join(' ')}</span>`,s:'🇰🇷 '+esc(s.ko),a:word}}}
  const q=pick(qs.length?qs:T.sents);return{l:'💬 Answer the question!',m:`<span style="font-size:.8em">${esc(q.en)}</span>`,s:'질문에 영어로 대답해요 (선생님 판정)',a:'자유 대답 OK!',say:q.en};
}
function question(pts){
  const Q=makeQ();let left=20,timer=null;
  const m=modal(`<div class="row" style="justify-content:space-between"><span class="qtype">${Q.l}</span><span class="ptsbadge">${'⭐'.repeat(pts)} ${pts}점</span></div>
    <div style="font-weight:900;font-size:22px;margin-top:10px">${TEMO[G.turn]} ${esc(G.names[G.turn])} 도전!</div>
    <div class="qmain en">${Q.m}</div><div class="qsub">${Q.s}</div><div class="ans en" id="an"></div>
    <div class="ring" id="ring" style="margin-top:14px"><span id="sec">20</span></div>
    <div class="row" style="justify-content:center;margin-top:20px">${Q.say?'<button class="btn purple" id="say">🔊 듣기</button>':''}<button class="btn white" id="show">👀 정답 보기</button>
      <button class="btn green big" id="ok">✅ 성공 +${pts}</button><button class="btn red big" id="no">❌ 실패</button></div>`);
  if(Q.say){speak(Q.say);m.querySelector('#say').onclick=()=>speak(Q.say)}
  const reveal=()=>{m.querySelector('#an').textContent=Q.a;if(Q.a&&!/[가-힣]/.test(Q.a))speak(Q.a)};
  m.querySelector('#show').onclick=reveal;
  timer=setInterval(()=>{left--;const s=m.querySelector('#sec');if(!s)return clearInterval(timer);s.textContent=Math.max(0,left);m.querySelector('#ring').style.setProperty('--p',left/20*100+'%');if(left<=5&&left>0)sfx('tick');if(left===0){sfx('bad');toast('⏰ 시간 끝!')}},1000);
  const close=ok=>{clearInterval(timer);if(ok){G.sc[G.turn]+=pts;sfx('ok');confetti(1200)}else sfx('bad');m.remove();nextTurn()};
  m.querySelector('#ok').onclick=()=>{reveal();setTimeout(()=>close(true),ok_delay())};m.querySelector('#no').onclick=()=>{reveal();setTimeout(()=>close(false),ok_delay())};
}
const ok_delay=()=>900;
function event(E){
  sfx('event');const me=G.turn;
  const others=[...Array(G.n).keys()].filter(i=>i!==me);
  const needPick=E.k==='steal'||E.k==='swap';
  const m=modal(`<div class="evt pop">${E.e}</div><div class="qmain en" style="margin-top:6px">${E.n}</div><div class="qsub">${TEMO[me]} ${esc(G.names[me])} — ${E.d}</div>
    ${needPick?`<div class="tpick">${others.map(i=>`<button class="btn" style="--c:${TCOL[i]};--d:#0004;--t:#fff" data-i="${i}">${TEMO[i]} ${esc(G.names[i])} (${G.sc[i]})</button>`).join('')}</div>`:`<div style="margin-top:20px"><button class="btn big pink" id="ok">확인!</button></div>`}`);
  if(E.k==='steal'||E.k==='swap'){m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const o=+b.dataset.i;
    if(E.k==='steal'){const v=Math.min(2,G.sc[o]);G.sc[o]-=v;G.sc[me]+=v}else{[G.sc[o],G.sc[me]]=[G.sc[me],G.sc[o]]}
    sfx('win');m.remove();nextTurn()})}
  else m.querySelector('#ok').onclick=()=>{
    if(E.k==='gift'){G.sc[me]+=2;confetti(1200)}if(E.k==='bomb')G.sc[me]=Math.max(0,G.sc[me]-2);
    if(E.k==='thunder')others.forEach(i=>G.sc[i]=Math.max(0,G.sc[i]-1));if(E.k==='lucky')G.sc=G.sc.map(s=>s+1);
    m.remove();nextTurn()};
}
function finish(){
  const max=Math.max(...G.sc);const win=G.sc.map((s,i)=>s===max?i:-1).filter(i=>i>=0);
  confetti(5000);sfx('win');
  const rank=[...G.sc.keys()].sort((a,b)=>G.sc[b]-G.sc[a]);
  shell(`<div class="card center pop" style="gap:14px;max-width:900px;margin:0 auto"><div class="big-emoji">🏆</div>
   <h1 class="hero" style="color:#4a22c9;text-shadow:none">${win.map(i=>TEMO[i]+' '+esc(G.names[i])).join(' & ')} WIN!</h1>
   <div class="grid" style="width:100%">${rank.map((i,r)=>`<div class="row" style="justify-content:space-between;background:#f3efff;border-radius:16px;padding:12px 18px;font-size:26px;font-weight:900"><span>${['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'][r]} ${TEMO[i]} ${esc(G.names[i])}</span><span>${G.sc[i]}점</span></div>`).join('')}</div>
   <div class="row" style="justify-content:center"><button class="btn big pink" id="again">🔁 새 판</button><button class="btn white" id="st">⚙️ 설정</button></div></div>`);
  $('#again').onclick=start;$('#st').onclick=setup;
}
setup();
</script></body></html>
